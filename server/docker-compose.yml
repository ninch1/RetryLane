name: retrylane

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retrylane
    ports:
      - "5433:5432"
    volumes:
      - retrylane_postgres_data:/var/lib/postgresql/data

volumes:
  retrylane_postgres_data:
